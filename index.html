<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tigger — Acceder</title>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js"></script>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { padding-top:0; }

    .password-wrapper { position:relative; }
    .password-wrapper .form-control { padding-right:52px; }
    .toggle-password {
      position:absolute; right:14px; top:50%;
      transform:translateY(-50%);
      background:none; border:none; cursor:pointer;
      color:var(--text-muted); font-size:18px;
      padding:4px; min-height:unset;
      transition:color var(--dur-fast);
    }
    .toggle-password:hover { color:var(--text-secondary); }

    .strength-bar {
      display:flex; gap:4px; margin-top:6px;
    }
    .strength-seg {
      height:3px; flex:1; border-radius:var(--r-full);
      background:var(--bg-overlay);
      transition:background var(--dur-base) var(--ease-smooth);
    }
    .strength-0 .strength-seg { background:var(--bg-overlay); }
    .strength-1 .strength-seg:nth-child(1) { background:var(--danger); }
    .strength-2 .strength-seg:nth-child(-n+2) { background:var(--warning); }
    .strength-3 .strength-seg { background:var(--success); }

    .form-tabs {
      display:grid; grid-template-columns:1fr 1fr;
      background:var(--bg-elevated);
      border:1px solid var(--border);
      border-radius:var(--r-md);
      padding:3px; margin-bottom:var(--sp-6);
    }

    .form-tab {
      padding:11px; border-radius:var(--r-sm);
      font-size:12px; font-weight:700;
      letter-spacing:.05em; text-transform:uppercase;
      cursor:pointer; border:none; background:transparent;
      color:var(--text-muted);
      transition:all var(--dur-base) var(--ease-smooth);
    }
    .form-tab.active {
      background:var(--bg-float);
      color:var(--text-primary); box-shadow:var(--shadow-sm);
    }

    .tab-panel { display:none; }
    .tab-panel.active { display:flex; flex-direction:column; gap:var(--sp-5); }

    .phone-input-wrap { display:flex; gap:var(--sp-2); }
    .country-code {
      display:flex; align-items:center; gap:6px;
      padding:0 var(--sp-3);
      background:var(--bg-elevated);
      border:1px solid var(--border-strong);
      border-radius:var(--r-md);
      font-size:15px; font-weight:600;
      color:var(--text-primary); white-space:nowrap;
      min-height:52px; flex-shrink:0;
    }

    .legal-note {
      font-size:11px; color:var(--text-muted);
      text-align:center; line-height:1.6;
      margin-top:var(--sp-2);
    }
    .legal-note a { color:var(--brand); text-decoration:none; }

    .alt-action {
      text-align:center; font-size:13px;
      color:var(--text-muted); margin-top:var(--sp-4);
    }
    .alt-action a { color:var(--brand); font-weight:600; text-decoration:none; }

    .bg-glow-1 {
      position:fixed; top:-200px; left:50%;
      transform:translateX(-50%);
      width:600px; height:400px; border-radius:50%;
      background:radial-gradient(ellipse, rgba(245,168,0,.08), transparent 70%);
      pointer-events:none; z-index:0;
    }
    .auth-layout { position:relative; z-index:1; }
  </style>
</head>
<body>
  <div class="bg-glow-1"></div>

  <div class="auth-layout">
    <div class="auth-card animate-in">

      <div class="auth-logo">
        <div class="auth-logo-icon">
          <img src="tigger.png" alt="Tigger">
        </div>
        <span class="auth-logo-name">TIGGER</span>
        <p style="font-size:13px;color:var(--text-muted);text-align:center;max-width:28ch;line-height:1.6;">
          Plataforma de inversiones y pagos cripto
        </p>
      </div>

      <!-- Mode switcher: Sign In / Sign Up -->
      <div class="form-tabs" id="mode-tabs">
        <button class="form-tab active" onclick="switchMode('login')">INICIAR SESIÓN</button>
        <button class="form-tab" onclick="switchMode('register')">REGISTRARSE</button>
      </div>

      <!-- LOGIN -->
      <div class="tab-panel active" id="panel-login">
        <!-- Login type: email / phone -->
        <div style="display:flex;gap:var(--sp-2);margin-bottom:var(--sp-1);">
          <button class="btn btn-subtle btn-sm" id="login-by-email" onclick="switchLoginType('email')" style="flex:1">
            <i class="ph ph-envelope"></i> EMAIL
          </button>
          <button class="btn btn-sm" id="login-by-phone" onclick="switchLoginType('phone')" style="flex:1;background:transparent;border:1px solid var(--border);color:var(--text-muted);">
            <i class="ph ph-phone"></i> TELÉFONO
          </button>
        </div>

        <div class="form-group" id="login-email-group">
          <label><i class="ph ph-envelope"></i> CORREO ELECTRÓNICO</label>
          <input type="email" class="form-control" placeholder="tu@email.com" id="login-email">
        </div>

        <div class="form-group" id="login-phone-group" style="display:none">
          <label><i class="ph ph-phone"></i> NÚMERO DE TELÉFONO</label>
          <div class="phone-input-wrap">
            <div class="country-code"><i class="ph ph-flag"></i> +58</div>
            <input type="tel" class="form-control" placeholder="4120000000" id="login-phone" inputmode="tel">
          </div>
        </div>

        <div class="form-group">
          <label><i class="ph ph-lock-simple"></i> CONTRASEÑA</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" placeholder="Tu contraseña" id="login-pass">
            <button class="toggle-password" type="button" onclick="togglePwd('login-pass', this)">
              <i class="ph ph-eye"></i>
            </button>
          </div>
        </div>

        <div style="text-align:right;margin-top:-8px;">
          <a href="#" style="font-size:12px;color:var(--brand);text-decoration:none;font-weight:600;">¿OLVIDASTE TU CONTRASEÑA?</a>
        </div>

        <button class="btn btn-primary btn-lg btn-block" onclick="handleAuth('login')">
          <i class="ph ph-sign-in"></i> ENTRAR
        </button>

        <div class="alt-action">
          ¿No tienes cuenta? <a href="#" onclick="switchMode('register');return false;">Regístrate aquí</a>
        </div>
      </div>

      <!-- REGISTER -->
      <div class="tab-panel" id="panel-register">
        <div style="display:flex;gap:var(--sp-2);margin-bottom:var(--sp-1);">
          <button class="btn btn-subtle btn-sm" id="reg-by-email" onclick="switchRegType('email')" style="flex:1">
            <i class="ph ph-envelope"></i> EMAIL
          </button>
          <button class="btn btn-sm" id="reg-by-phone" onclick="switchRegType('phone')" style="flex:1;background:transparent;border:1px solid var(--border);color:var(--text-muted);">
            <i class="ph ph-phone"></i> TELÉFONO
          </button>
        </div>

        <div class="form-group" id="reg-email-group">
          <label><i class="ph ph-envelope"></i> CORREO ELECTRÓNICO</label>
          <input type="email" class="form-control" placeholder="tu@email.com" id="reg-email">
        </div>

        <div class="form-group" id="reg-phone-group" style="display:none">
          <label><i class="ph ph-phone"></i> NÚMERO DE TELÉFONO</label>
          <div class="phone-input-wrap">
            <div class="country-code"><i class="ph ph-flag"></i> +58</div>
            <input type="tel" class="form-control" placeholder="4120000000" id="reg-phone" inputmode="tel">
          </div>
        </div>

        <div class="form-group">
          <label><i class="ph ph-lock-simple"></i> CONTRASEÑA</label>
          <div class="password-wrapper">
            <input type="password" class="form-control" placeholder="Mínimo 8 caracteres" id="reg-pass"
              oninput="checkStrength(this)">
            <button class="toggle-password" type="button" onclick="togglePwd('reg-pass', this)">
              <i class="ph ph-eye"></i>
            </button>
          </div>
          <div class="strength-bar strength-0" id="strength-bar">
            <div class="strength-seg"></div>
            <div class="strength-seg"></div>
            <div class="strength-seg"></div>
          </div>
        </div>

        <div class="form-group">
          <label><i class="ph ph-hand-pointing"></i> CÓDIGO DE INVITACIÓN</label>
          <input type="text" class="form-control" placeholder="Opcional" id="reg-invite"
            value="" style="letter-spacing:.1em;font-family:'Space Mono',monospace;">
        </div>

        <button class="btn btn-primary btn-lg btn-block" onclick="handleAuth('register')">
          <i class="ph ph-user-plus"></i> CREAR CUENTA
        </button>

        <p class="legal-note">
          Al registrarte aceptas nuestros <a href="#">Términos de Servicio</a> y
          <a href="#">Política de Privacidad</a>.
        </p>

        <div class="alt-action">
          ¿Ya tienes cuenta? <a href="#" onclick="switchMode('login');return false;">Inicia sesión</a>
        </div>
      </div>

    </div>
  </div>

  <div class="toast toast-success" id="toast">
    <i class="ph ph-check-circle toast-icon"></i>
    <span id="toast-msg">Bienvenido a Tigger</span>
  </div>

  <script src="script.js"></script>
  <script>
    function switchMode(mode) {
      const tabs = document.querySelectorAll('#mode-tabs .form-tab');
      const panels = document.querySelectorAll('.tab-panel');
      tabs.forEach((t,i) => t.classList.toggle('active', (i===0) === (mode==='login')));
      document.getElementById('panel-login').classList.toggle('active', mode==='login');
      document.getElementById('panel-register').classList.toggle('active', mode==='register');
    }

    function switchLoginType(type) {
      document.getElementById('login-email-group').style.display = type==='email' ? '' : 'none';
      document.getElementById('login-phone-group').style.display = type==='phone' ? '' : 'none';
      document.getElementById('login-by-email').className = 'btn btn-sm ' + (type==='email'?'btn-subtle':'');
      document.getElementById('login-by-phone').className = 'btn btn-sm ' + (type==='phone'?'btn-subtle':'');
      if (type!=='email') { document.getElementById('login-by-email').style='flex:1;background:transparent;border:1px solid var(--border);color:var(--text-muted)'; }
      if (type!=='phone') { document.getElementById('login-by-phone').style='flex:1;background:transparent;border:1px solid var(--border);color:var(--text-muted)'; }
    }

    function switchRegType(type) {
      document.getElementById('reg-email-group').style.display = type==='email' ? '' : 'none';
      document.getElementById('reg-phone-group').style.display = type==='phone' ? '' : 'none';
    }

    function togglePwd(id, btn) {
      const input = document.getElementById(id);
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      btn.querySelector('i').className = isText ? 'ph ph-eye' : 'ph ph-eye-slash';
    }

    function checkStrength(input) {
      const val = input.value;
      const bar = document.getElementById('strength-bar');
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      bar.className = 'strength-bar strength-' + score;
    }

    function handleAuth(mode) {
      const btn = event.target.closest('button');
      if (!btn) return;
      const orig = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="ph ph-circle-notch" style="animation:spin .7s linear infinite"></i> ' +
        (mode==='login' ? 'VERIFICANDO...' : 'CREANDO...');
      setTimeout(() => {
        localStorage.setItem('tigger_session', 'active');
        window.location.href = 'home.html';
      }, 1400);
    }

    const style = document.createElement('style');
    style.textContent = '@keyframes spin { to { transform:rotate(360deg); } }';
    document.head.appendChild(style);
  </script>
</body>
</html>
